name: Pruebas frontend
on:
  push:
    branches: [ main, Alelhy-infra-auth ]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Pruebas unitarias
        run: npm test
      - name: Compilacion
        run: npm run build
