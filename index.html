<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/LOGO.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GenLogs - Sistema de Gestión</title>
    <script>
      // Aplica el tema guardado ANTES de que React pinte nada, para que no
      // haya un parpadeo blanco->oscuro (o viceversa) al cargar la página.
      (function () {
        try {
          var tema = localStorage.getItem('genlogs-theme');
          var prefiereOscuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (tema === 'dark' || (!tema && prefiereOscuro)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
