<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/LOGO.png" />
    <!-- PWA: manifiesto, color de la barra y ícono para iPhone/iPad. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1E3A5F" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="GenLogs" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Conexión anticipada al API y a Cloudinary: la landing pide el catálogo y sus fotos al cargar. -->
    <link rel="preconnect" href="https://genlogs-backend-bkuv.onrender.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GenLogs gestiona solicitudes, cotizaciones, órdenes de compra y despachos de repuestos para empresas mineras." />
    <title>GenLogs - Sistema de Gestión</title>
    <script>
      // Aplica el tema guardado ANTES de que React pinte nada, para que no
      // haya un parpadeo blanco->oscuro (o viceversa) al cargar la página.
      (function () {
        try {
          var tema = localStorage.getItem('genlogs-theme');
          var prefiereOscuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (tema === 'dark' || (!tema && prefiereOscuro)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
